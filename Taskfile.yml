version: "3"

tasks:
  build:
    desc: Build the MCP binary
    cmds:
      - go build -o bin/multica-mcp .

  run:
    desc: Build and run the server
    deps: [build]
    cmds:
      - ./bin/multica-mcp

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v -count=1

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
